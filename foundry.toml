[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    # CTF Exchange (Polymarket) and its transitive deps
    "openzeppelin-contracts/=lib/ctf-exchange/lib/openzeppelin-contracts/contracts/",
    "common/=lib/ctf-exchange/src/common/",
    "exchange/=lib/ctf-exchange/src/exchange/",
    "solady/=lib/ctf-exchange/lib/solady/src/",
]

[lint]
exclude_lints = [
    "incorrect-shift",    # False positive on standard bitmask pattern in MockConditionalTokens
]
